name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libcairo2-dev libfontconfig1-dev libhidapi-dev fonts-dejavu-core
      - name: Check shell scripts
        run: bash -n scripts/linux/install.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test asset-free renderer
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref] $tokens, [ref] $errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build read-only probe
        run: cmake --build build --config Release --parallel
